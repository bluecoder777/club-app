services:
  db:
    image: postgres:15-alpine
    container_name: club-db
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - club-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    image: ghcr.io/bluecoder777/club-app-backend:release-production
    container_name: club-api
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - '127.0.0.1:8080:8080'
    depends_on:
      db:
        condition: service_healthy

volumes:
  club-postgres-data:
