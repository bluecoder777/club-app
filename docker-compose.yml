services:
  db:
    image: postgres:15-alpine
    container_name: club-db
    environment:
      POSTGRES_USER: clubuser
      POSTGRES_PASSWORD: clubpassword
      POSTGRES_DB: club
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  backend:
    build: 
      context: backend
      dockerfile: Dockerfile
    container_name: club-be
    ports:
      - "8080:8080"
    depends_on:
      - db

  frontend:
    build: 
      context: frontend
      dockerfile: Dockerfile
    container_name: club-fe
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  pgdata:
