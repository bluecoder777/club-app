services:
  db:
    image: postgres:15-alpine
    container_name: club-db
    env_file:
      - .env.docker
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  backend:
    build: 
      context: backend
      dockerfile: Dockerfile
    container_name: club-be
    env_file:
      - .env.docker
    ports:
      - "8080:8080"
    depends_on:
      - db

  frontend:
    build: 
      context: frontend
      dockerfile: Dockerfile
    container_name: club-fe
    ports:
      - "81:80"
    depends_on:
      - backend

volumes:
  pgdata:
